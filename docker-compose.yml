# Local stack for the extension-dedicated backend (see docs/product/architecture.md).
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: colcoor
      POSTGRES_PASSWORD: colcoor
      POSTGRES_DB: colcoor
    ports:
      - "5432:5432"
    volumes:
      - colcoor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colcoor -d colcoor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  colcoor_pgdata:

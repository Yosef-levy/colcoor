# Production stack: public traffic -> nginx only; API and Postgres on private Docker network.
# Usage (from repo root):
#   cp .env.example .env   # edit secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Postgres is NOT published to the host. The API is NOT published; only nginx exposes 80/443.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Conservative defaults for a small VM (roughly 2–4 GiB RAM). Lower shared_buffers if the
    # host is memory-constrained. max_connections stays modest to limit RAM per connection.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
      - -c
      - effective_cache_size=512MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=8MB
      - -c
      - random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  pgbouncer:
    build:
      context: ./pgbouncer
      dockerfile: Dockerfile
    image: colcoor-pgbouncer:1.23.1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-}
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -p 6432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -c 'SELECT 1' >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    image: colcoor-backend:prod
    restart: unless-stopped
    stop_grace_period: 35s
    env_file:
      - .env
    environment:
      NODE_ENV: production
      COLCOOR_ENV: production
      # Must match nginx `upstream colcoor_backend` (nginx/nginx.conf).
      PORT: "8000"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      COLCOOR_LOG_LEVEL: ${COLCOOR_LOG_LEVEL:-INFO}
      COLCOOR_LOG_FORMAT: ${COLCOOR_LOG_FORMAT:-}
      COLCOOR_METRICS_ENABLED: ${COLCOOR_METRICS_ENABLED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_TRUST_PROXY: ${RATE_LIMIT_TRUST_PROXY:-true}
      COLCOOR_EVENT_PURGE_SCHEDULER_ENABLED: ${COLCOOR_EVENT_PURGE_SCHEDULER_ENABLED:-true}
      COLCOOR_RUN_MIGRATIONS: ${COLCOOR_RUN_MIGRATIONS:-true}
      COLCOOR_INSTANCE_ID: ${COLCOOR_INSTANCE_ID:-}
      COLCOOR_NODE_ROLE: ${COLCOOR_NODE_ROLE:-primary}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      REDIS_URL: ${REDIS_URL}
      GCS_BUCKET: ${GCS_BUCKET}
      COLCOOR_IMAGE_STORAGE: ${COLCOOR_IMAGE_STORAGE:-gcs}
      GCS_SIGNED_URL_TTL_SECONDS: ${GCS_SIGNED_URL_TTL_SECONDS:-900}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    # Readiness: verifies DB via /ready (compose + nginx depend on this). Dockerfile image
    # HEALTHCHECK is superseded by this block when using Compose.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; p=os.environ.get('PORT','8000'); urllib.request.urlopen(f'http://127.0.0.1:{p}/ready', timeout=12)\"",
        ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    networks:
      - internal

  nginx:
    image: nginx:1.26-alpine
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "80:80"
      # Uncomment after TLS certificates exist on the host (see nginx/nginx.conf):
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS: mount certs read-only, e.g.:
      # - /etc/letsencrypt/live/your.domain/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      # - /etc/letsencrypt/live/your.domain/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "9090:9090"
    networks:
      - internal

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  prometheus_data: {}
  grafana_data: {}
  postgres_data:
    name: colcoor_postgres_data

;; Colcoor production PgBouncer configuration (transaction pooling).
;; Mounted into the pgbouncer container; see docker-compose.prod.yml.
;;
;; Client connections: backend → pgbouncer:6432
;; Server connections: pgbouncer → postgres:5432 (bounded by default_pool_size)

[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; Private Docker network only; credentials come from userlist.txt (generated at start).
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

;; Transaction mode multiplexes many client sessions onto few server connections.
;; Requires SERVER_RESET_QUERY and asyncpg prepared-statement cache disabled in the app.
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3

server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits

;; Timeouts (seconds)
server_connect_timeout = 15
query_timeout = 0
client_idle_timeout = 0

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

admin_users = colcoor

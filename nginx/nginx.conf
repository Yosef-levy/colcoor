# Colcoor production reverse proxy (nginx -> FastAPI backend).
# Mount this file as /etc/nginx/nginx.conf (see docker-compose.prod.yml).
#
# TLS: obtain certs (e.g. certbot) on the host, mount them into the nginx container,
#       uncomment the HTTPS server block below, and publish 443 in compose.

user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ~10 r/s per client IP, 10 MB zone (~160k tracked IPs). burst=20 nodelay allows short spikes
    # (e.g. page load + a few API calls) before steady-state limiting. Tune rate if legitimate
    # traffic is 429-heavy; /health and /ready are excluded from this zone.
    limit_req_zone $binary_remote_addr zone=colcoor_api:10m rate=10r/s;
    limit_req_status 429;

    # Reasonable defaults for API + future SSE/WebSocket (side chat).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream colcoor_backend {
        server backend:8000;
        keepalive 32;
    }

    # HTTP — terminate TLS here after you mount certs and enable the server below.
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        client_max_body_size 20m;

        # Liveness: unthrottled (orchestrators / Docker liveness).
        location = /health {
            proxy_pass http://colcoor_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        # Readiness: unthrottled (depends on DB; used by compose for backend health).
        location = /ready {
            proxy_pass http://colcoor_backend/ready;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        location / {
            limit_req zone=colcoor_api burst=20 nodelay;

            proxy_pass http://colcoor_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS (uncomment after TLS certificates exist on the host + volume mounts).
    # Mirror the same /health, /ready, limit_req, and proxy_* settings as HTTP above.
    #
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name your.domain.example;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #
    #     client_max_body_size 20m;
    #
    #     location = /health { ... }
    #     location = /ready { ... }
    #     location / { limit_req zone=colcoor_api burst=20 nodelay; ... }
    # }
}
